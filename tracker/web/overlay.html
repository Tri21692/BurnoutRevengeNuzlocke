<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Burnout Nuzlocke overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,800&display=swap" rel="stylesheet">
<style>
  /* Palette taken from Burnout Revenge's own HUD and menus */
  :root {
    --hazard: #F2B705;   /* hazard-stripe yellow */
    --ember:  #E8571C;   /* boost-bar orange */
    --wreck:  #C8261B;   /* crash red */
    --steel:  rgba(36, 33, 29, 0.9);
    --chalk:  #F3EAD3;
    --smoke:  #9A8F7E;
    --type: "Barlow Condensed", "Arial Narrow", sans-serif;
  }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: var(--type); font-style: italic; color: var(--chalk); padding: 18px; }
  .hidden { display: none !important; }
  #hud { margin-left: 22px; }   /* room for the slant of the plate */

  /* The HUD plate: a slanted steel panel with a hazard-striped edge */
  .plate {
    display: inline-grid; grid-template-columns: 22px auto;
    transform: skewX(-12deg); transform-origin: left top;
    background: var(--steel); border-bottom: 3px solid var(--ember);
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.45));
  }
  .stripe { background: repeating-linear-gradient(-45deg, var(--hazard) 0 9px, #1a1714 9px 18px); }
  .body { padding: 10px 22px 12px 16px; transform: skewX(12deg); }
  .plate.grace { filter: grayscale(0.75) drop-shadow(0 4px 10px rgba(0, 0, 0, 0.45)); border-bottom-color: var(--smoke); }

  .mode { font-weight: 800; font-size: 34px; line-height: 0.95; color: var(--hazard); letter-spacing: 0.01em; }
  .mode small { font-size: 18px; color: var(--smoke); font-weight: 600; margin-left: 8px; }

  .stats { display: flex; gap: 22px; margin-top: 6px; }
  .stat b { display: block; font-weight: 800; font-size: 30px; line-height: 1; }
  .stat span { font-weight: 600; font-size: 15px; color: var(--smoke); white-space: nowrap; }

  .car { display: flex; align-items: center; gap: 12px; margin-top: 10px; padding-top: 8px;
         border-top: 1px solid rgba(243, 234, 211, 0.18); }
  .car .name { font-weight: 800; font-size: 26px; text-transform: uppercase; }
  .car.wrecked .name { color: var(--wreck); text-decoration: line-through; text-decoration-thickness: 3px; }
  .hearts { display: flex; gap: 5px; }
  .hearts svg { width: 22px; height: 20px; }
  .hearts .full { fill: var(--wreck); }
  .hearts .empty { fill: none; stroke: var(--smoke); stroke-width: 2; }
  .pool { display: flex; align-items: center; gap: 6px; }
  .pool > i { font-style: normal; font-weight: 800; font-size: 13px; letter-spacing: 1px; color: var(--smoke); }
  .pool.out > i { color: var(--wreck); }

  /* The current car's events in order, one medal each */
  .medals { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 7px; max-width: 520px; }
  .medals svg { width: 17px; height: 21px; }
  .medals .uncounted { opacity: 0.4; }

  /* Result ticker: the one animated moment */
  .ticker {
    display: block; width: max-content; max-width: 640px; margin-top: 10px;
    padding: 6px 18px; transform: skewX(-12deg); transform-origin: left top;
    font-weight: 800; font-size: 22px;
  }
  .ticker > span { display: inline-block; transform: skewX(12deg); }
  .ticker.win  { background: var(--hazard); color: #1a1714; }
  .ticker.loss { background: var(--wreck); color: var(--chalk); }
  .ticker.info { background: var(--steel); color: var(--chalk); }
  .ticker.achievement { background: #1a1714; color: var(--hazard); border: 2px solid var(--hazard); }
  .picks { margin-top: 6px; font-weight: 600; font-size: 17px; color: var(--chalk); }
  .picks i { font-style: normal; font-weight: 800; font-size: 13px; letter-spacing: 1px; color: var(--smoke); margin-right: 4px; }
  .picks div { white-space: nowrap; }
  .tok { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--hazard); margin-right: 3px; vertical-align: -1px; }
  .tok.full { background: var(--hazard); }
  .ticker.enter { animation: slam 420ms cubic-bezier(.2, .9, .25, 1.15); }
  @keyframes slam {
    from { opacity: 0; transform: skewX(-12deg) translateX(-60px); }
    to   { opacity: 1; transform: skewX(-12deg) translateX(0); }
  }

  /* Run's dead: the end-of-run card */
  .dead { display: inline-block; background: var(--steel); border-top: 10px solid transparent;
          border-image: repeating-linear-gradient(-45deg, var(--hazard) 0 12px, #1a1714 12px 24px) 10;
          padding: 18px 34px 24px; filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.5)); }
  .dead h1 { margin: 0; font-weight: 800; font-size: 92px; line-height: 0.9; color: var(--wreck);
             transform: skewX(-6deg); }
  .dead p { margin: 4px 0 16px; font-weight: 600; font-size: 20px; color: var(--smoke); }
  .dead .ended { margin: -10px 0 16px; color: var(--chalk); font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(3, auto); gap: 14px 40px; }
  .grid b { display: block; font-weight: 800; font-size: 40px; line-height: 1; color: var(--chalk); }
  #d-best, #d-diff { font-size: 26px; line-height: 1.5; }
  .grid span { font-weight: 600; font-size: 16px; color: var(--smoke); }

  @media (prefers-reduced-motion: reduce) { .ticker.enter { animation: none; } }
</style>
</head>
<body>
  <div id="hud" class="hidden">
    <div class="plate" id="plate">
      <div class="stripe"></div>
      <div class="body">
        <div class="mode" id="mode"></div>
        <div class="stats">
          <div class="stat"><b id="won"></b><span>events won</span></div>
          <div class="stat"><b id="lost"></b><span>race wrecks</span></div>
          <div class="stat"><b id="crashlost"></b><span>crash wrecks</span></div>
          <div class="stat"><b id="time"></b><span>run time</span></div>
          <div class="stat hidden" id="tokstat"><b id="toks"></b><span>revive tokens</span></div>
        </div>
        <div class="car hidden" id="car">
          <div class="name" id="carname"></div>
          <div class="pool" id="racepool"><i>RACE</i><div class="hearts" id="hearts"></div></div>
          <div class="pool" id="crashpool"><i>CRASH</i><div class="hearts" id="crashhearts"></div></div>
        </div>
        <div class="medals hidden" id="medals"></div>
        <div class="picks hidden" id="picks"></div>
      </div>
    </div>
    <div class="ticker hidden" id="ticker"><span id="tickertext"></span></div>
  </div>

  <div id="deadcard" class="dead hidden">
    <h1>Run's dead</h1>
    <p id="deadsub"></p>
    <p class="ended" id="ended"></p>
    <div class="grid">
      <div><b id="d-won"></b><span>events won</span></div>
      <div><b id="d-lost"></b><span>race / crash wrecks</span></div>
      <div><b id="d-time"></b><span>run time</span></div>
      <div><b id="d-streak"></b><span>best win streak</span></div>
      <div><b id="d-rate"></b><span>win rate</span></div>
      <div><b id="d-diff"></b><span>difficulty</span></div>
      <div><b id="d-ach"></b><span>achievements</span></div>
      <div><b id="d-best"></b><span>best car</span></div>
      <div><b id="d-perf"></b><span>gold + perfects</span></div>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const HEART = 'M10 18s-7-4.6-8.6-9C0.2 5.4 2.6 2 6 2c1.9 0 3.2 1 4 2.3C10.8 3 12.1 2 14 2c3.4 0 5.8 3.4 4.6 7-1.6 4.4-8.6 9-8.6 9z';
let lastMessageId = null;

function hearts(full, total) {
  let html = '';
  for (let i = 0; i < total; i++) {
    html += `<svg viewBox="0 0 20 20" aria-hidden="true"><path class="${i < full ? 'full' : 'empty'}" d="${HEART}"/></svg>`;
  }
  return html;
}

const MEDAL = { gold: '#E8B83A', silver: '#C9CED6', bronze: '#C27C48' };
function medal(h) {
  const fill = MEDAL[h.medal] || 'none';
  return `<svg viewBox="0 0 24 30" class="${h.counted ? '' : 'uncounted'}" aria-hidden="true">` +
    `<path d="M6 0h5l2 8h-4zM13 0h5l-3 8h-4z" fill="${h.won ? 'var(--hazard)' : 'var(--wreck)'}"/>` +
    `<circle cx="12" cy="19" r="9" fill="${fill}" stroke="${fill === 'none' ? 'var(--smoke)' : 'rgba(0,0,0,.35)'}" stroke-width="2"/>` +
    (h.crash ? `<text x="12" y="23" text-anchor="middle" font-size="10" font-weight="800" font-style="normal" fill="#1a1714">C</text>` : '') +
    (h.won ? '' : `<path d="M5 26L19 12" stroke="var(--wreck)" stroke-width="3" stroke-linecap="round"/>`) +
    `</svg>`;
}

function esc(t) { return String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }

function aiText(level) {
  return level && level !== 'Off' ? `AI ${level}` : '';
}

function render(s) {
  const r = s.run;
  const show = r && s.connected !== undefined;
  $('hud').classList.toggle('hidden', !show || (r && r.dead && !r.grace));
  $('deadcard').classList.toggle('hidden', !(r && r.dead && !r.grace));
  if (!r) return;

  // HUD plate
  $('mode').innerHTML = r.grace
    ? `Grace mode <small>not counting</small>`
    : `${r.difficulty} Nuzlocke <small>${r.lives_start} + ${r.lives_start} lives${aiText(s.ai_level || r.ai_level) ? ' · ' + aiText(s.ai_level || r.ai_level) : ''}</small>`;
  $('plate').classList.toggle('grace', r.grace);
  $('won').textContent = `${r.won}/${r.played}`;
  $('lost').textContent = `${r.cars_lost}/${r.race_cars_total ?? r.cars_total}`;
  $('crashlost').textContent = `${r.crash_cars_lost || 0}/${r.crash_cars_total ?? r.cars_total}`;
  $('time').textContent = r.time;

  const car = s.car;
  $('car').classList.toggle('hidden', !car);
  if (car) {
    $('carname').textContent = car.loaned ? `${car.name} (loaned)` : car.name;
    const crashLives = car.crash_lives ?? car.lives;
    const canRace = car.can_race ?? true, canCrash = car.can_crash ?? true;
    const out = (!canRace || car.lives === 0) && (!canCrash || crashLives === 0);
    $('car').classList.toggle('wrecked', out && !r.grace);
    $('racepool').classList.toggle('hidden', r.grace || !canRace);   // crash cars can't race
    $('crashpool').classList.toggle('hidden', r.grace || !canCrash); // garage-only cars can't crash
    $('racepool').classList.toggle('out', car.lives === 0);
    $('crashpool').classList.toggle('out', crashLives === 0);
    $('hearts').innerHTML = hearts(car.lives, r.lives_start);
    $('crashhearts').innerHTML = hearts(crashLives, r.lives_start);
  }
  const p = r.dead ? null : r.picks;
  $('picks').classList.toggle('hidden', !p);
  if (p) {
    const list = (x) => x && x.length ? x.map(esc).join(' / ') : '-';
    $('picks').innerHTML = `<div><i>NEXT RACE</i>${list(p.race)}</div><div><i>NEXT CRASH</i>${list(p.crash)}</div>`;
  }
  const rule = r.token_rule;
  $('tokstat').classList.toggle('hidden', !rule || r.grace);
  if (rule) {
    let t = '';
    for (let i = 0; i < rule.hold; i++) t += `<span class="tok${i < r.tokens ? ' full' : ''}"></span>`;
    $('toks').innerHTML = t;
  }
  const hist = (car && car.history) || [];
  $('medals').classList.toggle('hidden', !hist.length);
  $('medals').innerHTML = hist.slice(-24).map(medal).join('');

  // Result ticker
  const m = s.message;
  $('ticker').classList.toggle('hidden', !m);
  if (m) {
    $('tickertext').textContent = m.text;
    $('ticker').className = `ticker ${m.kind}`;
    if (m.id !== lastMessageId) {
      void $('ticker').offsetWidth;          // restart the animation
      $('ticker').classList.add('enter');
      lastMessageId = m.id;
    }
  }

  // Run's dead card
  if (r.dead && !r.grace) {
    const pool = r.cars_lost >= (r.race_cars_total ?? r.cars_total) ? 'Race' : 'Crash';
    $('deadsub').textContent = `Every car is wrecked for ${pool} events. Started ${r.started}.`;
    $('d-won').textContent = `${r.won}/${r.played}`;
    $('d-lost').textContent = `${r.cars_lost}/${r.race_cars_total ?? r.cars_total} · ${r.crash_cars_lost || 0}/${r.crash_cars_total ?? r.cars_total}`;
    $('d-time').textContent = r.time;
    $('d-streak').textContent = r.best_streak;
    $('d-rate').textContent = r.played ? `${Math.round(100 * r.won / r.played)}%` : '-';
    $('d-diff').textContent = aiText(r.ai_level) ? `${r.difficulty} · ${aiText(r.ai_level)}` : r.difficulty;
    const sm = r.summary || {};
    $('ended').textContent = sm.ended_by ? `Ended by ${sm.ended_by}` : '';
    $('d-ach').textContent = `${(sm.achievements || []).length}/${r.achievements_total || 10}`;
    const best = (sm.cars || []).slice().sort((a, b) => b.wins - a.wins)[0];
    $('d-best').textContent = best && best.wins ? `${best.name} (${best.wins})` : '-';
    $('d-perf').textContent = sm.perfects ?? 0;
  }
}

async function tick() {
  try {
    const res = await fetch('/state', { cache: 'no-store' });
    render(await res.json());
  } catch (e) {
    $('hud').classList.add('hidden');      // tracker closed: keep the stream clean
    $('deadcard').classList.add('hidden');
  }
  setTimeout(tick, 500);
}
tick();
</script>
</body>
</html>
