# Publishes a GitHub release with the matching zip from releases/ and notes from CHANGELOG.md.
# Start it from the Actions tab (Run workflow, enter the version, e.g. 1.0), or push a tag like v1.0.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0"
        required: true
      title:
        description: "Release title (optional, defaults to V<version>)"
        required: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the package and release notes
        id: info
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TITLE: ${{ inputs.title }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then ver="${INPUT_VERSION#[vV]}"; else ver="${GITHUB_REF_NAME#v}"; fi
          zip="releases/BurnoutRevengeNuzlocke-V${ver}.zip"
          test -f "$zip" || { echo "::error::$zip is missing"; exit 1; }
          awk -v h="## V${ver}" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::No '## V${ver}' section in CHANGELOG.md"; exit 1; }
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "zip=${zip}" >> "$GITHUB_OUTPUT"
          echo "title=${INPUT_TITLE:-V${ver}}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.info.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.info.outputs.title }}
          body_path: notes.md
          files: ${{ steps.info.outputs.zip }}
